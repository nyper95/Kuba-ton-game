<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuba Ton</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0b0e11; color: white; font-family: sans-serif; text-align: center; }
        .score-container { background: #1e2329; padding: 20px; border-radius: 20px; margin: 20px auto; width: 80%; border: 1px solid #333; }
        .score { font-size: 50px; color: #00ff00; font-weight: bold; }
        .btn-main { background: #0088cc; border: none; width: 200px; height: 200px; border-radius: 50%; color: white; font-size: 24px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="score-container">
        <div class="score" id="puntos-display">0</div>
        <p id="status" style="color: #848e9c;">Cargando...</p>
    </div>
    <button class="btn-main" onclick="tocar()">¡MINAR!</button>

<script>
    const SB_URL = "https://wmjjiigpbspfkhznegdr.supabase.co";
    const SB_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtamppaWdwYnNwZmtoem5lZ2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg2MzAxMzUsImV4cCI6MjA4NDIwNjEzNX0.yqmC4GjzRWrBwfF9xQm74I8EcgnS3yuJOpDJPVbSe7M";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    let tg = window.Telegram.WebApp;
    let userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id.toString() : "test_user";
    let puntos = 0;

    async function iniciar() {
        const { data } = await supabaseClient.from('perfiles').select('puntos').eq('user_id', userId).maybeSingle();
        if (data) {
            puntos = data.puntos;
            document.getElementById('status').innerText = "Sincronizado ✅";
        } else {
            await supabaseClient.from('perfiles').insert([{ user_id: userId, puntos: 0 }]);
            document.getElementById('status').innerText = "Nuevo usuario 🆕";
        }
        document.getElementById('puntos-display').innerText = puntos;
    }

    async function tocar() {
        puntos++;
        document.getElementById('puntos-display').innerText = puntos;
        // Guarda en cada clic para estar seguros
        await supabaseClient.from('perfiles').upsert({ user_id: userId, puntos: puntos }, { onConflict: 'user_id' });
    }

    iniciar();
</script>
</body>
</html>
