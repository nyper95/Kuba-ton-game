b<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuba Ton Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; margin: 0; padding: 0; text-align: center; overflow: hidden; }
        .header { padding: 15px; background: #111; border-bottom: 1px solid #0088cc; font-size: 18px; }
        .content { height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        /* Secciones */
        .section { display: none; width: 100%; }
        .active { display: block; }

        /* Botón y Puntos */
        .score { font-size: 45px; color: #00ff00; font-weight: bold; margin-bottom: 20px; }
        .btn-main { background: radial-gradient(circle, #0088cc, #004466); border: none; width: 170px; height: 170px; border-radius: 50%; color: white; font-size: 22px; font-weight: bold; box-shadow: 0 0 20px #0088cc; cursor: pointer; }
        .btn-main:active { transform: scale(0.9); }

        /* Navegación */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
        .nav-item { color: #666; font-size: 14px; cursor: pointer; }
        .nav-item.selected { color: #0088cc; font-weight: bold; }
        
        /* Tareas */
        .card { background: #1a1a1a; margin: 10px; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .btn-blue { background: #0088cc; border: none; color: white; padding: 10px 15px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="header" id="user-display">Cargando...</div>

<div class="content">
    <div id="juego" class="section active">
        <div class="score"><span id="p-game">0</span> 💎</div>
        <button class="btn-main" onclick="tap()">¡GANAR!</button>
    </div>

    <div id="misiones" class="section">
        <h2>Misiones</h2>
        <div class="card">
            <span>Canal Oficial 📢</span>
            <button class="btn-blue" onclick="window.open('https://t.me/kubatoncomunidad')">+500</button>
        </div>
    </div>

    <div id="billetera" class="section">
        <h2>Billetera</h2>
        <div class="score" style="color:white;"><span id="p-wallet">0</span> 💎</div>
        <p>Equivale a: <span id="val-usdt">0.00</span> USDT</p>
        <button class="btn-blue" style="width:80%;" onclick="alert('Mínimo de retiro: 5 USDT')">RETIRAR</button>
    </div>
</div>

<div class="nav-bar">
    <div class="nav-item selected" id="t-juego" onclick="tab('juego')">🎮 Juego</div>
    <div class="nav-item" id="t-misiones" onclick="tab('misiones')">📋 Misiones</div>
    <div class="nav-item" id="t-billetera" onclick="tab('billetera')">💰 Billetera</div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let p = parseInt(localStorage.getItem('puntos')) || 0;

    function render() {
        document.getElementById('p-game').innerText = p;
        document.getElementById('p-wallet').innerText = p;
        document.getElementById('val-usdt').innerText = (p / 10000).toFixed(2);
        localStorage.setItem('puntos', p);
    }

    if (tg.initDataUnsafe.user) {
        document.getElementById('user-display').innerText = "👤 " + tg.initDataUnsafe.user.first_name;
    }

    function tap() {
        p++;
        render();
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function tab(name) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('selected'));
        document.getElementById(name).classList.add('active');
        document.getElementById('t-' + name).classList.add('selected');
    }

    render();
    tg.ready();
</script>

</body>
</html>
